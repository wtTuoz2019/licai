<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>理财对冲操作台</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #12181f;
      --panel2: #181f28;
      --line: #243041;
      --text: #e8eef6;
      --muted: #7d8fa3;
      --good: #3dd68c;
      --warn: #f5c26b;
      --bad: #ff7a8a;
      --accent: #4da3ff;
      --long: #3dd68c;
      --short: #ff7a8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .02em; }
    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 12px;
      padding: 12px 16px 24px;
      min-height: calc(100vh - 48px);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    aside.card { padding: 12px; }
    h2 { margin: 0 0 10px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: none; }
    label { display: block; color: var(--muted); margin: 8px 0 4px; font-size: 12px; }
    input, button, textarea, select { font: inherit; color: var(--text); }
    input, textarea, select {
      width: 100%;
      background: #0d1319;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
    }
    select { color: var(--text); }
    button {
      background: #1c2633;
      border: 1px solid #33455c;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.primary { background: #1a4f8f; border-color: #2d74c2; }
    button.good { background: #147047; border-color: #1d9660; }
    button.warn { background: #5a4314; border-color: #8a681d; }
    button.ghost { background: transparent; }
    button.danger { background: #6b1f2a; border-color: #a33; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .ops button.good:disabled {
      opacity: 1;
      background: #15241c;
      border-color: #24382d;
      color: #6d8a7a;
    }
    .ops button.warn:disabled {
      opacity: 1;
      background: #241c10;
      border-color: #3a3018;
      color: #8a7a58;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    #lev-edit { width: 72px; flex: 0 0 72px; padding: 8px; }
    .row[hidden], #modal-spin[hidden], #modal-actions[hidden] { display: none !important; }
    .edit-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .accounts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .acct {
      text-align: left;
      width: 100%;
      background: #0e141b;
      padding: 10px 12px;
    }
    .acct b { display: block; font-size: 13px; }
    .acct-id {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      margin-right: 4px;
    }
    #acct-id-now {
      font-size: 13px;
      font-weight: 650;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .acct.active { outline: 1px solid var(--accent); background: #152033; }
    .muted { color: var(--muted); }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sym { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
    .lev-chip {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1c2836;
      color: var(--muted);
    }
    .lev-chip b { color: var(--text); font-weight: 650; }
    .ops { display: flex; gap: 6px; flex-wrap: wrap; }
    .ops button { padding: 8px 14px; font-weight: 600; }
    .funds {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .funds + .funds { margin-top: 8px; }
    .kpi {
      background: var(--panel2);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .kpi span { display: block; color: var(--muted); font-size: 11px; }
    .kpi b { display: block; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .pos-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .pos {
      background: var(--panel2);
      border-radius: 10px;
      padding: 12px 14px;
      border-left: 3px solid transparent;
    }
    .pos.long { border-left-color: var(--long); }
    .pos.short { border-left-color: var(--short); }
    .pos-h { color: var(--muted); font-size: 11px; }
    .pos .qty { font-size: 15px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .pos .entry { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .pos .pnl { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .up { color: var(--good); }
    .down { color: var(--bad); }
    .wait { color: var(--warn); }
    .harvest {
      margin-top: 10px;
      background: var(--panel2);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .harvest-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .harvest-top b { color: var(--text); font-variant-numeric: tabular-nums; }
    .track {
      height: 6px;
      background: #0d1319;
      border-radius: 99px;
      margin: 8px 0 6px;
      overflow: hidden;
    }
    .track i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 99px;
      transition: width .25s ease;
    }
    .track i.ready { background: var(--good); }
    .harvest-set {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .harvest-set label { margin: 0; }
    .harvest-set input[type="number"] {
      width: 88px;
      padding: 6px 8px;
    }
    .auto-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .auto-toggle input { width: auto; accent-color: var(--good); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      background: var(--panel2);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .chip b { color: var(--text); margin: 0 4px; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
    }
    .ok { background: #143d2a; color: var(--good); }
    .no { background: #4a1d1d; color: var(--bad); }
    .pill.wait { background: #3d3114; color: var(--warn); }
    .hint {
      background: #121920;
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      margin: 10px 0 0;
      white-space: pre-wrap;
      border-radius: 0 8px 8px 0;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.detail { color: var(--muted); max-width: 420px; word-break: break-all; }
    .err { color: var(--bad); margin: 0 0 10px; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 16, .72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .overlay[hidden] { display: none !important; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 20px 16px;
      width: min(520px, 94vw);
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    .modal h3 { margin: 0 0 8px; font-size: 17px; }
    .modal p { margin: 0 0 16px; color: var(--muted); white-space: pre-wrap; }
    .modal p:empty { display: none; margin: 0; }
    .modal .row { justify-content: flex-end; margin-top: 12px; }
    .events-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .events-head .ghost { font-size: 12px; padding: 4px 10px; }
    .events-modal { width: min(860px, 96vw); max-height: 86vh; display: flex; flex-direction: column; }
    .events-modal h3 { flex: 0 0 auto; }
    .events-scroll {
      flex: 1 1 auto;
      overflow: auto;
      max-height: 58vh;
      margin: 0 0 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .events-scroll table { margin: 0; }
    .events-scroll td.detail { max-width: 520px; white-space: pre-wrap; }
    #log-overlay { z-index: 1100; }
    .log-modal {
      width: min(720px, 96vw);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      animation: logIn .18s ease-out;
    }
    @keyframes logIn {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
      to { opacity: 1; transform: none; }
    }
    .log-modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }
    .log-modal-head h3 { margin: 0 0 6px; font-size: 16px; }
    .log-meta { margin: 0; font-size: 12px; color: var(--muted); }
    .log-pill {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 11px;
      vertical-align: middle;
    }
    .log-pill.ok { background: #143d2a; color: var(--good); }
    .log-pill.no { background: #4a1d1d; color: var(--bad); }
    .log-close {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
    }
    .log-close:hover { border-color: var(--line); color: var(--text); background: var(--panel2); }
    .log-steps {
      flex: 1 1 auto;
      overflow: auto;
      padding: 12px 14px;
      max-height: 58vh;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .log-step {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--panel2);
      border: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.45;
    }
    .log-step.fail {
      border-color: rgba(255, 107, 107, .35);
      background: rgba(74, 29, 29, .35);
    }
    .log-step .mark {
      font-weight: 700;
      color: var(--good);
    }
    .log-step.fail .mark { color: var(--bad); }
    .log-step .name { color: var(--text); font-weight: 600; margin-bottom: 4px; }
    .log-step .time {
      float: right;
      color: var(--muted);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }
    .log-step .body {
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
    }
    .log-modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--line);
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 8px auto 4px;
      border: 3px solid #2a3848;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .funds, .pos-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>理财对冲操作台</h1>
    <button type="button" id="btn-logout" class="ghost">退出</button>
  </header>
  <div class="layout">
    <aside class="card">
      <h2>账号</h2>
      <div class="row" style="margin-top:0">
        <button class="primary" type="button" id="btn-show-add">添加账号</button>
      </div>
      <form id="add-form" hidden>
        <label>名称</label>
        <input name="name" required placeholder="主号" />
        <label>API Key</label>
        <input name="api_key" required autocomplete="off" />
        <label>API Secret</label>
        <input name="api_secret" required type="password" autocomplete="off" />
        <label>代理（可留空，已配 Webshare 时自动分配）</label>
        <input name="proxy" placeholder="http://user:pass@ip:port" />
        <label>① 结算币（默认 USDT）</label>
        <select id="add-settle">
          <option value="USDT" selected>USDT（默认）</option>
          <option value="USDC">USDC</option>
        </select>
        <label>② 代币</label>
        <select id="add-base"></select>
        <input type="hidden" name="hedge_symbol" id="add-symbol" value="ETHUSDT" />
        <p class="muted" id="add-symbol-preview">将使用 ETHUSDT</p>
        <div class="row">
          <button type="button" id="btn-cancel-add">取消</button>
          <button class="primary" type="submit">确认添加</button>
        </div>
      </form>
      <div class="accounts" id="accounts"></div>
    </aside>
    <main class="card">
      <div id="empty" class="muted">选择账号</div>
      <div id="panel" hidden>
        <div class="toolbar">
          <div class="meta">
            <span class="acct-id" id="acct-id-now"></span>
            <span class="sym" id="symbol-now">-</span>
            <span class="lev-chip" id="settle-chip" hidden><b id="settle-asset"></b></span>
            <span class="lev-chip"><b id="lev">-</b>x</span>
            <span id="stable-pill" class="pill wait">-</span>
          </div>
          <div class="ops">
            <button id="btn-refresh" class="ghost" type="button">刷新</button>
            <button id="btn-enter" class="primary" type="button">一键入场</button>
            <button id="btn-scale" class="warn" type="button" disabled>加仓</button>
            <button id="btn-harvest" class="good" type="button">一键收利</button>
            <button id="btn-switch" class="warn" type="button">换年化</button>
            <button type="button" id="btn-settings" class="ghost">设置</button>
          </div>
        </div>
        <div id="error" class="err" hidden></div>
        <div class="funds">
          <div class="kpi"><span>现价</span><b id="mid-price">-</b></div>
          <div class="kpi"><span>账户总额</span><b id="equity">-</b></div>
          <div class="kpi"><span>昨日收益</span><b id="earn-yesterday">-</b></div>
          <div class="kpi"><span>uniMMR</span><b id="mmr">-</b></div>
        </div>
        <div class="funds">
          <div class="kpi"><span>现货 USDT</span><b id="spot">-</b></div>
          <div class="kpi" id="usdt-flex-box"><span>USDT 活期</span><b id="usdt-flex">-</b></div>
          <div class="kpi"><span>BFUSD</span><b id="bfusd">-</b></div>
          <div class="kpi"><span>理财合计</span><b id="earn-total">-</b></div>
        </div>
        <div class="chips" id="collateral" hidden></div>
        <div class="pos-row">
          <div class="pos long">
            <div class="pos-h">多仓</div>
            <div class="qty" id="long-qty">-</div>
            <div class="entry" id="long-entry">仓位价 -</div>
            <div class="pnl" id="long-pnl">-</div>
          </div>
          <div class="pos short">
            <div class="pos-h">空仓</div>
            <div class="qty" id="short-qty">-</div>
            <div class="entry" id="short-entry">仓位价 -</div>
            <div class="pnl" id="short-pnl">-</div>
          </div>
        </div>
        <div class="harvest">
          <div class="harvest-top">
            <span>收利进度 <b id="best-pnl">-</b> / <b id="min-profit">-</b></span>
            <span>手续费 <b id="fee">-</b></span>
          </div>
          <div class="track"><i id="harvest-fill"></i></div>
          <p class="muted harvest-why" id="harvest-why"></p>
          <div class="harvest-set">
            <label>每次收利</label>
            <input id="tp-edit" type="number" min="0" step="0.1" placeholder="按仓位" />
            <span class="muted">USDT</span>
            <button type="button" id="btn-save-tp">保存</button>
            <button type="button" id="btn-tp-auto" hidden>恢复自动</button>
            <label class="auto-toggle" title="无仓须严平稳才自动开仓；有仓须金叉收空/死叉收多，并用更宽的收利平稳。手动入场/收利不受影响">
              <input type="checkbox" id="auto-harvest" />
              自动收利
            </label>
          </div>
          <div class="harvest-set" id="scale-box" hidden>
            <span class="muted" id="scale-why"></span>
          </div>
        </div>
        <div id="settings-box" class="edit-box" hidden>
          <p class="muted">出口 IP <b id="ip">-</b> · <span id="proxy-mode"></span> · 代理 <b id="proxy-now">默认</b> · <span id="snap-age"></span></p>
          <p class="muted">杠杆 目标 <b id="lev-target">-</b> · 实际 <b id="lev-actual">-</b></p>
          <div class="row">
            <button type="button" id="btn-set-leverage">设置杠杆</button>
            <input id="lev-edit" type="number" min="1" max="125" step="1" placeholder="100" title="目标杠杆：尝试提到这个倍数；算仓用实际倍数" />
            <button type="button" id="btn-edit-symbol">切换套保</button>
            <button type="button" id="btn-edit-proxy">修改代理</button>
            <button type="button" id="btn-delete">解绑</button>
          </div>
          <div id="edit-symbol-box" class="edit-box" hidden>
            <label>① 结算币（默认 USDT，可切 USDC）</label>
            <select id="settle-edit">
              <option value="USDT">USDT（默认）</option>
              <option value="USDC">USDC</option>
            </select>
            <label>② 代币</label>
            <select id="base-edit"></select>
            <p class="muted" id="symbol-preview">将使用 ETHUSDT</p>
            <div class="row">
              <button type="button" id="btn-cancel-symbol">取消</button>
              <button type="button" id="btn-save-symbol" class="primary">保存</button>
            </div>
          </div>
          <div id="edit-proxy-box" class="edit-box" hidden>
            <label>代理</label>
            <input id="proxy-edit" placeholder="http://user:pass@ip:port 或留空后点 Webshare" />
            <p class="muted" id="webshare-hint" hidden></p>
            <div class="row">
              <button type="button" id="btn-cancel-proxy">取消</button>
              <button type="button" id="btn-webshare-proxy">Webshare 分配</button>
              <button type="button" id="btn-proxy" class="primary">保存</button>
            </div>
          </div>
          <h2 class="events-head">
            最近操作
            <button type="button" id="btn-events-history" class="ghost">历史日志</button>
          </h2>
          <table>
            <thead><tr><th>时间</th><th>动作</th><th>结果</th><th>详情</th></tr></thead>
            <tbody id="events"></tbody>
          </table>
        </div>
        <p class="hint" id="action-msg" hidden></p>
      </div>
    </main>
  </div>
  <div id="overlay" class="overlay" hidden aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modal-title">请确认</h3>
      <p id="modal-body"></p>
      <div id="modal-spin" class="spinner" hidden></div>
      <div class="row" id="modal-actions">
        <button type="button" id="modal-cancel">取消</button>
        <button type="button" id="modal-extra" class="warn" hidden>只买理财</button>
        <button type="button" id="modal-ok" class="primary">确认</button>
      </div>
    </div>
  </div>
  <div id="events-overlay" class="overlay" hidden aria-hidden="true">
    <div class="modal events-modal" role="dialog" aria-modal="true">
      <h3>历史操作日志</h3>
      <p class="muted" id="events-history-hint">数据存在本机 SQLite，重启后仍可查看。</p>
      <div class="events-scroll">
        <table>
          <thead><tr><th>时间</th><th>动作</th><th>结果</th><th>详情</th></tr></thead>
          <tbody id="events-history-body"></tbody>
        </table>
      </div>
      <div class="row">
        <button type="button" id="events-history-more">加载更早</button>
        <button type="button" id="events-history-close" class="primary">关闭</button>
      </div>
    </div>
  </div>
  <div id="log-overlay" class="overlay" hidden aria-hidden="true">
    <div class="modal log-modal" role="dialog" aria-modal="true" aria-labelledby="log-title">
      <div class="log-modal-head">
        <div>
          <h3 id="log-title">操作详情</h3>
          <p class="log-meta" id="log-meta"></p>
        </div>
        <button type="button" class="log-close" id="log-close" aria-label="关闭">×</button>
      </div>
      <div class="log-steps" id="log-steps"></div>
      <div class="log-modal-foot">
        <button type="button" id="log-copy">复制全文</button>
        <button type="button" id="log-ok" class="primary">关闭</button>
      </div>
    </div>
  </div>
  <script>
    let selected = null;
    let accountsCache = [];
    let loadGen = 0;
    let timer = null;
    let busy = false;
    let lastSymbol = "ETHUSDT";
    const DEFAULT_HEDGE_SYMBOLS = ["ETHUSDT", "BTCUSDT", "ETHUSDC", "BTCUSDC", "SOLUSDT", "BNBUSDT"];
    let hedgeSymbols = DEFAULT_HEDGE_SYMBOLS.slice();
    const snapCache = {};
    const SNAP_TTL = 24 * 60 * 60 * 1000;
    const FUNDS_STORE = "licai_funds_cache_v1";
    let pollMs = 120000;
    let liveAt = 0;
    const lastSeenByAccount = Object.create(null);
    const $ = (id) => document.getElementById(id);

    function seenEventId(id) {
      return Number(lastSeenByAccount[cacheId(id)]) || 0;
    }

    function setSeenEventId(id, eid) {
      lastSeenByAccount[cacheId(id)] = Math.max(seenEventId(id), Number(eid) || 0);
    }

    function eventsForAccount(events, id) {
      const aid = Number(id);
      return (events || []).filter((e) => {
        if (e == null || e.account_id == null || e.account_id === "") return true;
        return Number(e.account_id) === aid;
      });
    }

    function mergeHedgeSymbols(list) {
      const out = [];
      [...(list || []), ...DEFAULT_HEDGE_SYMBOLS].forEach((s) => {
        const u = String(s || "").toUpperCase();
        if (u && !out.includes(u)) out.push(u);
      });
      return out.length ? out : DEFAULT_HEDGE_SYMBOLS.slice();
    }

    function cacheId(id) {
      return String(id);
    }

    function sameAccount(id) {
      return selected != null && Number(selected) === Number(id);
    }

    function acctNo(id) {
      const aid = Number(id);
      if (!Number.isFinite(aid)) return null;
      const idx = accountsCache.findIndex((a) => Number(a.id) === aid);
      return idx >= 0 ? idx + 1 : null;
    }

    function setAcctLabel(account) {
      const el = $("acct-id-now");
      if (!el) return;
      const id = account && account.id != null ? Number(account.id) : NaN;
      if (!Number.isFinite(id)) {
        el.textContent = "";
        return;
      }
      const no = acctNo(id);
      const name = (account && account.name) ? String(account.name) : "";
      const prefix = no != null ? `#${no}` : `#${id}`;
      el.textContent = name ? `${prefix} ${name}` : prefix;
    }

    function resetPanelSkeleton(account) {
      $("empty").hidden = true;
      $("panel").hidden = false;
      $("error").hidden = true;
      $("error").textContent = "";
      setAcctLabel(account);
      $("symbol-now").textContent = (account && account.hedge_symbol) || "-";
      const settleChip = $("settle-chip");
      const settleEl = $("settle-asset");
      if (settleChip && settleEl && account && account.hedge_symbol) {
        const settle = parseHedgeSymbol(account.hedge_symbol).settle;
        settleEl.textContent = settle;
        settleChip.hidden = !settle;
      } else if (settleChip) {
        settleChip.hidden = true;
      }
      $("lev").textContent = "-";
      $("mid-price").textContent = "-";
      $("equity").textContent = "-";
      $("earn-yesterday").textContent = "-";
      setMmr("-");
      $("spot").textContent = "-";
      $("usdt-flex").textContent = "-";
      const flexBox = $("usdt-flex-box");
      if (flexBox) flexBox.hidden = true;
      $("bfusd").textContent = "-";
      $("earn-total").textContent = "-";
      $("long-qty").textContent = "-";
      $("short-qty").textContent = "-";
      $("long-entry").textContent = "仓位价 -";
      $("short-entry").textContent = "仓位价 -";
      setPnl($("long-pnl"), NaN);
      setPnl($("short-pnl"), NaN);
      $("best-pnl").textContent = "-";
      $("min-profit").textContent = "-";
      $("fee").textContent = "-";
      $("harvest-fill").style.width = "0%";
      $("harvest-why").textContent = "加载中…";
      $("btn-enter").disabled = true;
      $("btn-harvest").disabled = true;
      $("btn-scale").disabled = true;
      $("btn-switch").disabled = true;
      const pill = $("stable-pill");
      if (pill) {
        pill.textContent = "-";
        pill.className = "pill wait";
      }
      const box = $("collateral");
      if (box) {
        box.hidden = true;
        box.innerHTML = "";
      }
      const tbody = $("events");
      if (tbody) tbody.innerHTML = "";
      if (account) {
        lastSymbol = account.hedge_symbol || lastSymbol;
        syncHedgePickers($("settle-edit"), $("base-edit"), $("symbol-preview"), null, lastSymbol);
        $("proxy-edit").value = account.proxy || "";
        $("proxy-now").textContent = account.proxy || "默认";
      }
    }

    function showAccountError(s, accountMeta) {
      const acc = (s && s.account) || accountMeta || {};
      resetPanelSkeleton(acc);
      $("error").hidden = false;
      let msg = (s && s.error) || "加载失败";
      if (/Invalid API-key|IP|permissions|-2015/i.test(msg)) {
        msg += "。此账号未放行当前出口 IP，请在币安 API 白名单加入该 IP，或给本账号绑定可用代理后再刷新。";
      }
      $("error").textContent = msg;
      $("ip").textContent = (s && s.exit_ip) || "-";
      $("proxy-mode").textContent = (s && s.proxy_mode) || (acc.proxy ? "账号代理" : "默认出口 IP");
      $("harvest-why").textContent = "账号未就绪，仓位不会与其他账号共用";
    }
    const ACTIONS = {
      enter: { title: "一键入场", hint: "其它活期先换成最高年化，再申购、入金并开对冲。" },
      scale: { title: "加仓", hint: "在 uniMMR 安全线内，两边一起放大仓位。" },
      harvest: { title: "一键收利", hint: "平掉盈利腿并补仓。USDC 本位会先换成 USDT 再买理财。" },
      switch: { title: "换更高年化", hint: "分批换成更高年化产品。" },
      leverage: { title: "设置杠杆", hint: "先按输入倍数去交易所设置；算仓始终用实际落地的倍数。100 不行会落到允许的最高档。" },
    };

    function hideModal() {
      busy = false;
      $("overlay").hidden = true;
      $("overlay").setAttribute("aria-hidden", "true");
      $("modal-spin").hidden = true;
      $("modal-actions").hidden = false;
      $("modal-extra").hidden = true;
      $("modal-ok").className = "primary";
    }

    function showLoading(title, body) {
      busy = true;
      $("overlay").hidden = false;
      $("overlay").setAttribute("aria-hidden", "false");
      $("modal-title").textContent = title || "执行中";
      $("modal-body").textContent = body || "请稍候";
      $("modal-spin").hidden = false;
      $("modal-actions").hidden = true;
      $("modal-extra").hidden = true;
    }

    function confirmAction({ title, body, okText, danger }) {
      busy = true;
      $("overlay").hidden = false;
      $("overlay").setAttribute("aria-hidden", "false");
      $("modal-title").textContent = title;
      $("modal-body").textContent = body || "";
      $("modal-spin").hidden = true;
      $("modal-actions").hidden = false;
      $("modal-extra").hidden = true;
      $("modal-ok").textContent = okText || "确认";
      $("modal-ok").className = danger ? "danger" : "primary";
      $("modal-cancel").textContent = "取消";
      return new Promise((resolve) => {
        const ok = $("modal-ok");
        const cancel = $("modal-cancel");
        const extra = $("modal-extra");
        const finish = (value) => {
          ok.onclick = null;
          cancel.onclick = null;
          extra.onclick = null;
          if (!value) hideModal();
          resolve(value);
        };
        ok.onclick = () => finish(true);
        cancel.onclick = () => finish(false);
      });
    }

    function confirmChoices({ title, body, extraText, extraId, okText, okId, danger }) {
      busy = true;
      $("overlay").hidden = false;
      $("overlay").setAttribute("aria-hidden", "false");
      $("modal-title").textContent = title;
      $("modal-body").textContent = body || "";
      $("modal-spin").hidden = true;
      $("modal-actions").hidden = false;
      $("modal-cancel").textContent = "取消";
      $("modal-ok").textContent = okText || "确认";
      $("modal-ok").className = danger ? "danger" : "primary";
      const extra = $("modal-extra");
      extra.hidden = !extraText;
      extra.textContent = extraText || "";
      return new Promise((resolve) => {
        const ok = $("modal-ok");
        const cancel = $("modal-cancel");
        const finish = (value) => {
          ok.onclick = null;
          cancel.onclick = null;
          extra.onclick = null;
          extra.hidden = true;
          if (!value) hideModal();
          resolve(value);
        };
        ok.onclick = () => finish(okId || "ok");
        extra.onclick = () => finish(extraId || "extra");
        cancel.onclick = () => finish(null);
      });
    }

    function persistFunds() {
      try {
        localStorage.setItem(FUNDS_STORE, JSON.stringify(snapCache));
      } catch (err) {}
    }

    function restoreFunds() {
      try {
        const raw = JSON.parse(localStorage.getItem(FUNDS_STORE) || "{}");
        Object.keys(raw).forEach((key) => {
          if (raw[key] && raw[key].data) snapCache[key] = raw[key];
        });
      } catch (err) {}
    }

    function snapHit(id) {
      return snapCache[cacheId(id)];
    }

    function rememberSnap(id, data) {
      const ageMs = (Number(data && data.cache_age) || 0) * 1000;
      snapCache[cacheId(id)] = { at: Date.now() - ageMs, data };
      persistFunds();
    }

    function snapFresh(id) {
      const hit = snapHit(id);
      return !!(hit && Date.now() - hit.at < SNAP_TTL);
    }

    function ageText(at, label) {
      if (!at) return "";
      const sec = Math.max(0, Math.round((Date.now() - at) / 1000));
      if (sec < 5) return `${label}刚更新`;
      if (sec < 60) return `${label} ${sec} 秒前`;
      if (sec < 3600) return `${label} ${Math.round(sec / 60)} 分钟前`;
      if (sec < 86400) return `${label} ${(sec / 3600).toFixed(1)} 小时前`;
      return `${label} ${Math.round(sec / 86400)} 天前`;
    }

    function showSnapAge() {
      const el = $("snap-age");
      if (!el) return;
      const hit = selected ? snapHit(selected) : null;
      el.textContent = [ageText(hit && hit.at, "资金"), ageText(liveAt, "仓位")].filter(Boolean).join(" · ");
    }

    function parseHedgeSymbol(sym) {
      const s = String(sym || "ETHUSDT").toUpperCase();
      for (const q of ["USDC", "FDUSD", "BUSD", "USDT"]) {
        if (s.endsWith(q) && s.length > q.length) {
          return { base: s.slice(0, -q.length), settle: q };
        }
      }
      return { base: "ETH", settle: "USDT" };
    }

    function composeHedgeSymbol(base, settle) {
      return String(base || "ETH").toUpperCase() + String(settle || "USDT").toUpperCase();
    }

    function settlesAvailable() {
      // 结算币固定两档，不单靠接口列表（旧进程可能还没带上 USDC 币对）
      return ["USDT", "USDC"];
    }

    function basesForSettle(settle) {
      const q = String(settle || "USDT").toUpperCase();
      const bases = [];
      hedgeSymbols.forEach((sym) => {
        const p = parseHedgeSymbol(sym);
        if (p.settle === q && !bases.includes(p.base)) bases.push(p.base);
      });
      if (bases.length) return bases;
      return q === "USDC" ? ["ETH", "BTC"] : ["ETH"];
    }

    function fillSelect(el, values, current, labels) {
      if (!el) return;
      el.innerHTML = "";
      values.forEach((v) => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = (labels && labels[v]) || v;
        if (v === current) opt.selected = true;
        el.appendChild(opt);
      });
      if (current && !values.includes(current) && values.length) el.value = values[0];
    }

    function syncHedgePickers(settleEl, baseEl, previewEl, hiddenEl, currentSym) {
      const parsed = parseHedgeSymbol(currentSym || "ETHUSDT");
      const settles = settlesAvailable();
      let settle = parsed.settle;
      if (!settles.includes(settle)) settle = settles.includes("USDT") ? "USDT" : settles[0];
      fillSelect(settleEl, settles, settle, {
        USDT: "USDT（默认）",
        USDC: "USDC",
      });
      const bases = basesForSettle(settleEl.value);
      let base = parsed.base;
      if (!bases.includes(base)) base = bases[0];
      fillSelect(baseEl, bases, base);
      const sym = composeHedgeSymbol(baseEl.value, settleEl.value);
      if (hiddenEl) hiddenEl.value = sym;
      if (previewEl) previewEl.textContent = "将使用 " + sym;
      return sym;
    }

    function bindHedgePickers(settleId, baseId, previewId, hiddenId) {
      const settleEl = $(settleId);
      const baseEl = $(baseId);
      const previewEl = previewId ? $(previewId) : null;
      const hiddenEl = hiddenId ? $(hiddenId) : null;
      if (!settleEl || !baseEl) return;
      const refresh = () => {
        const bases = basesForSettle(settleEl.value);
        const keep = bases.includes(baseEl.value) ? baseEl.value : bases[0];
        fillSelect(baseEl, bases, keep);
        const sym = composeHedgeSymbol(baseEl.value, settleEl.value);
        if (hiddenEl) hiddenEl.value = sym;
        if (previewEl) previewEl.textContent = "将使用 " + sym;
      };
      settleEl.onchange = refresh;
      baseEl.onchange = refresh;
    }

    function currentEditSymbol() {
      return composeHedgeSymbol($("base-edit").value, $("settle-edit").value);
    }

    function toNum(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : NaN;
    }

    function signedAmt(v, digits) {
      const n = toNum(v);
      if (!Number.isFinite(n)) return "-";
      const t = n.toFixed(digits);
      return n > 0 ? "+" + t : t;
    }

    function setPnl(el, v) {
      el.textContent = signedAmt(v, 4);
      el.classList.remove("up", "down");
      const n = toNum(v);
      if (n > 0) el.classList.add("up");
      if (n < 0) el.classList.add("down");
    }

    function setMmr(text) {
      const el = $("mmr");
      el.textContent = text || "-";
      el.classList.remove("up", "down", "wait");
      const n = toNum(text);
      if (!Number.isFinite(n)) return;
      if (n < 1.5) el.classList.add("down");
      else if (n < 2.5) el.classList.add("wait");
      else el.classList.add("up");
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function shortTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) {
        const s = String(iso).replace("T", " ").replace("Z", "");
        return s.length >= 19 ? s.slice(5, 19) : s.slice(5, 16);
      }
      const p = (n) => String(n).padStart(2, "0");
      return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function eventPreview(detail) {
      const text = String(detail || "");
      if (!text) return "";
      // 优先露出开仓/对冲片段，避免只显示前面的换产品/赎回
      const keys = ["开仓 挂单", "开仓 市价", "对冲平衡", "单边兜底", "入场顺序", "自动开仓", "自动收利"];
      let hit = -1;
      for (const k of keys) {
        const i = text.indexOf(k);
        if (i >= 0 && (hit < 0 || i < hit)) hit = i;
      }
      const slice = hit >= 0 ? text.slice(Math.max(0, hit - 8)) : text;
      return slice.length > 160 ? slice.slice(0, 160) + "…" : slice;
    }

    function parseLogSteps(detail) {
      const text = String(detail || "").trim();
      if (!text) return [];
      return text.split("；").map((part) => {
        const raw = part.trim();
        if (!raw) return null;
        // "16:18:12 开仓 挂单 BUY[ok]: detail" or "开仓…[FAIL]: …"
        const m = raw.match(/^(?:(\d{1,2}:\d{2}:\d{2})\s+)?(.+?)\[(ok|FAIL)\]:\s*([\s\S]*)$/i);
        if (m) {
          return {
            time: m[1] || "",
            name: m[2].trim(),
            ok: String(m[3]).toLowerCase() === "ok",
            body: m[4].trim(),
          };
        }
        return { time: "", name: "步骤", ok: !/FAIL|错误|失败/.test(raw), body: raw };
      }).filter(Boolean);
    }

    let _logFullText = "";

    function showLogDetail(ev) {
      const overlay = $("log-overlay");
      const stepsEl = $("log-steps");
      const ok = !!ev.ok;
      const action = ev.action || "操作";
      const when = shortTime(ev.created_at);
      $("log-title").textContent = action;
      $("log-meta").innerHTML =
        `${esc(when)} · <span class="log-pill ${ok ? "ok" : "no"}">${ok ? "成功" : "失败"}</span>`;
      const detail = String(ev.detail || "");
      _logFullText = `${when} · ${action} · ${ok ? "成功" : "失败"}\n\n${detail}`;
      const steps = parseLogSteps(detail);
      stepsEl.innerHTML = "";
      if (!steps.length) {
        stepsEl.innerHTML = `<div class="log-step"><span class="mark">·</span><div><div class="body">${esc(detail || "无详情")}</div></div></div>`;
      } else {
        steps.forEach((s) => {
          const div = document.createElement("div");
          div.className = "log-step" + (s.ok ? "" : " fail");
          div.innerHTML =
            `<span class="mark">${s.ok ? "✓" : "✗"}</span>` +
            `<div>` +
            `<div class="name">${s.time ? `<span class="time">${esc(s.time)}</span>` : ""}${esc(s.name)}</div>` +
            `<div class="body">${esc(s.body)}</div>` +
            `</div>`;
          stepsEl.appendChild(div);
        });
      }
      overlay.hidden = false;
      overlay.setAttribute("aria-hidden", "false");
      stepsEl.scrollTop = 0;
    }

    function closeLogDetail() {
      const overlay = $("log-overlay");
      overlay.hidden = true;
      overlay.setAttribute("aria-hidden", "true");
    }

    function appendEventRows(tbody, events) {
      (events || []).forEach((e) => {
        const tr = document.createElement("tr");
        const detail = String(e.detail || "");
        const short = eventPreview(detail);
        tr.innerHTML = `<td>${esc(shortTime(e.created_at))}</td><td>${esc(e.action)}</td><td>${e.ok ? "成功" : "失败"}</td><td class="detail" title="${esc(detail)}">${esc(short)}</td>`;
        tr.style.cursor = "pointer";
        tr.onclick = () => showLogDetail(e);
        tbody.appendChild(tr);
      });
    }

    function fillEvents(events, tbodyEl) {
      const tbody = tbodyEl || $("events");
      if (!tbody) return;
      tbody.innerHTML = "";
      appendEventRows(tbody, events);
    }

    let historyOldestId = null;
    let historyLoading = false;

    async function openEventsHistory({ append = false } = {}) {
      if (!selected) {
        setActionMsg("先选账号");
        return;
      }
      if (historyLoading) return;
      historyLoading = true;
      const overlay = $("events-overlay");
      const body = $("events-history-body");
      const more = $("events-history-more");
      try {
        if (!append) {
          historyOldestId = null;
          body.innerHTML = "";
          overlay.hidden = false;
          overlay.setAttribute("aria-hidden", "false");
          $("events-history-hint").textContent = "加载中…";
        }
        const q = new URLSearchParams({ limit: "80" });
        if (append && historyOldestId) q.set("before_id", String(historyOldestId));
        const data = await api(`/api/accounts/${selected}/events?${q}`);
        const rows = eventsForAccount(data.events || [], selected);
        if (!rows.length) {
          $("events-history-hint").textContent = append
            ? "没有更早的记录了"
            : "这个账号还没有操作日志（存在本机 data/accounts.sqlite）";
          more.disabled = true;
          return;
        }
        appendEventRows(body, rows);
        historyOldestId = Math.min(...rows.map((e) => Number(e.id) || 0));
          $("events-history-hint").textContent =
            `已加载 ${body.children.length} 条 · 库 ${data.db_path || ""}` +
            (data.actions_log ? ` · 全文备份 ${data.actions_log}` : "");
          more.disabled = !data.has_more;
      } catch (err) {
        $("events-history-hint").textContent = "加载失败：" + (err.message || err);
      } finally {
        historyLoading = false;
      }
    }

    function closeEventsHistory() {
      const overlay = $("events-overlay");
      overlay.hidden = true;
      overlay.setAttribute("aria-hidden", "true");
    }

    async function api(path, opts) {
      const res = await fetch(path, Object.assign({
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
      }, opts));
      if (res.status === 401) {
        location.replace("/");
        throw new Error("未登录");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail;
        const msg = Array.isArray(detail) ? JSON.stringify(detail) : (detail || data.error || res.statusText);
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }
      return data;
    }

    async function loadAccounts() {
      const data = await api("/api/accounts");
      if (data.hedge_symbols && data.hedge_symbols.length) hedgeSymbols = mergeHedgeSymbols(data.hedge_symbols);
      if (data.live_poll_seconds) pollMs = Number(data.live_poll_seconds) * 1000;
      syncHedgePickers($("add-settle"), $("add-base"), $("add-symbol-preview"), $("add-symbol"), $("add-symbol").value || "ETHUSDT");
      const box = $("accounts");
      box.innerHTML = "";
      accountsCache = Array.isArray(data.accounts) ? data.accounts.slice() : [];
      accountsCache.forEach((a, i) => {
        const btn = document.createElement("button");
        btn.className = "acct" + (sameAccount(a.id) ? " active" : "");
        const sym = a.hedge_symbol || "ETHUSDT";
        const p = parseHedgeSymbol(sym);
        const no = i + 1;
        btn.innerHTML = `<b><span class="acct-id">#${no}</span>${esc(a.name)}</b><div class="muted">${esc(p.settle)} · ${esc(p.base)}</div>`;
        btn.onclick = () => selectAccount(a.id);
        box.appendChild(btn);
      });
      if (selected != null) {
        const cur = accountsCache.find((a) => Number(a.id) === Number(selected));
        if (cur) setAcctLabel(cur);
      }
      return data;
    }

    async function selectAccount(id) {
      if (busy) return;
      const gen = ++loadGen;
      selected = Number(id);
      liveAt = 0;
      setActionMsg("");
      $("settings-box").hidden = true;
      hideEditBoxes();
      const list = await loadAccounts();
      if (gen !== loadGen || !sameAccount(id)) return;
      const meta = (list.accounts || []).find((a) => Number(a.id) === Number(id)) || null;

      const hit = snapHit(id);
      const usable = !!(hit && hit.data && hit.data.ok && hit.data.legs);
      if (usable) {
        render(hit.data);
        showSnapAge();
      } else {
        resetPanelSkeleton(meta || { id: Number(id), hedge_symbol: "ETHUSDT" });
      }

      if (timer) clearInterval(timer);
      timer = setInterval(() => { if (!busy) pollLive(); }, pollMs);
      pollLive();
      if (usable && snapFresh(id)) return;
      if (!usable) {
        showLoading("加载资金", "请稍候");
        try {
          if (gen !== loadGen || !sameAccount(id)) return;
          await refresh({ force: true });
        } finally {
          if (gen === loadGen) hideModal();
        }
        return;
      }
      refresh({ silent: true, force: false });
    }

    function applyLive(s) {
      if (!s || !sameAccount(s.account && s.account.id)) return;
      if (s.ok === false) return;
      if (s.uni_mmr != null) setMmr(s.uni_mmr || "-");
      if (s.leverage != null) $("lev").textContent = s.leverage;
      const levAct = $("lev-actual");
      if (levAct && s.leverage != null) levAct.textContent = s.leverage || "-";
      const levTgt = $("lev-target");
      if (levTgt) {
        const tgt = (s.account && s.account.hedge_leverage) || s.leverage_target || "";
        if (tgt) levTgt.textContent = tgt;
      }
      const levChip = $("lev") && $("lev").closest(".lev-chip");
      if (levChip) {
        const tgt = Number((s.account && s.account.hedge_leverage) || s.leverage_target || 0) || 0;
        const act = Number(s.leverage || 0) || 0;
        levChip.title = tgt && act && tgt !== act
          ? `实际 ${act}x · 目标 ${tgt}x`
          : (act ? `杠杆 ${act}x` : "");
      }
      const price = s.price || (s.stability && s.stability.mid) || "";
      if (price) $("mid-price").textContent = price;
      const legs = s.legs || {};
      $("long-qty").textContent = legs.long_qty || "-";
      $("short-qty").textContent = legs.short_qty || "-";
      const longEntry = legs.long_entry || "";
      const shortEntry = legs.short_entry || "";
      $("long-entry").textContent = "仓位价 " + (toNum(longEntry) > 0 ? longEntry : "-");
      $("short-entry").textContent = "仓位价 " + (toNum(shortEntry) > 0 ? shortEntry : "-");
      setPnl($("long-pnl"), legs.long_pnl);
      setPnl($("short-pnl"), legs.short_pnl);
      const h = s.harvest || {};
      $("fee").textContent = h.round_trip_fee || "-";
      $("min-profit").textContent = h.min_profit || "-";
      const tp = $("tp-edit");
      if (s.account && selected && snapHit(selected) && snapHit(selected).data) {
        snapHit(selected).data.account = Object.assign(snapHit(selected).data.account || {}, s.account);
      }
      const accLive = s.account || ((selected && snapHit(selected) && snapHit(selected).data && snapHit(selected).data.account) || {});
      const autoBox = $("auto-harvest");
      if (autoBox && document.activeElement !== autoBox) {
        autoBox.checked = !!accLive.auto_harvest;
      }
      if (tp && document.activeElement !== tp) {
        const custom = !!accLive.take_profit_custom;
        const suggested = h.min_profit || h.auto_profit || "";
        tp.value = custom && accLive.take_profit_usdt ? accLive.take_profit_usdt : suggested;
        tp.placeholder = h.auto_profit ? `建议 ${h.auto_profit}` : "按仓位";
        const autoBtn = $("btn-tp-auto");
        if (autoBtn) autoBtn.hidden = !custom;
      }
      const best = Math.max(toNum(h.winner_pnl) || 0, toNum(legs.long_pnl) || 0, toNum(legs.short_pnl) || 0, 0);
      $("best-pnl").textContent = Number.isFinite(best) ? best.toFixed(4) : "-";
      const need = Math.max(toNum(h.min_profit) || 0, 0);
      const pct = need > 0 ? Math.min(100, (best / need) * 100) : 0;
      const fill = $("harvest-fill");
      fill.style.width = pct + "%";
      fill.className = (h.can_click || h.force_ok) ? "ready" : "";
      const gap = Math.max(0, need - best);
      let why = (h.can_click || h.force_ok)
        ? (h.reason || "可以收利")
        : (need > 0 ? `还差 ${gap.toFixed(2)} 到收利门槛` : (h.reason || ""));
      if (accLive.auto_harvest) {
        const flat = toNum(legs.long_qty) <= 0 && toNum(legs.short_qty) <= 0;
        if (flat) {
          why = ((s.stability && s.stability.stable)
            ? "自动开仓待命：无仓且已平稳，后台会双边入场。 "
            : "自动开仓已开：无仓，等价格平稳后自动双边开仓。 ") + why;
        } else {
          why = (h.can_click
            ? "自动收利待命：浮盈/冷却/收利平稳已够，等 MACD 金叉收空或死叉收多。 "
            : "自动收利已开：浮盈达标+冷却后，须金叉/死叉，并用更宽收利平稳。 ") + why;
        }
      }
      $("harvest-why").textContent = why;
      $("btn-harvest").title = h.reason || "";
      const en = s.enter || {};
      const scaleBox = $("scale-box");
      const scaleEl = $("scale-why");
      const scaleBtn = $("btn-scale");
      if (en.scale_ok) {
        if (scaleBox) scaleBox.hidden = false;
        if (scaleEl) {
          scaleEl.textContent =
            `可加仓：目标 ${en.target_qty}，现在 ${en.current_qty}，两边各加 ${en.add_qty}` +
            (en.uni_mmr ? `，uniMMR ${en.uni_mmr}` : "");
        }
        if (scaleBtn) {
          scaleBtn.disabled = false;
          scaleBtn.title = en.reason || "两边一起加仓";
        }
      } else {
        if (scaleBox) scaleBox.hidden = true;
        if (scaleEl) scaleEl.textContent = "";
        if (scaleBtn) {
          scaleBtn.disabled = true;
          scaleBtn.title = en.reason || "当前不能加仓";
        }
      }
      const st = s.stability || {};
      const pill = $("stable-pill");
      pill.textContent = st.stable ? "平稳" : "不稳";
      pill.className = "pill " + (st.stable ? "ok" : "no");
      $("btn-enter").disabled = false;
      $("btn-harvest").disabled = !(h.can_click || h.force_ok);
      if (selected && snapHit(selected) && snapHit(selected).data) {
        Object.assign(snapHit(selected).data, {
          uni_mmr: s.uni_mmr || snapHit(selected).data.uni_mmr,
          leverage: s.leverage || snapHit(selected).data.leverage,
          legs: s.legs || snapHit(selected).data.legs,
          stability: s.stability || snapHit(selected).data.stability,
          enter: s.enter || snapHit(selected).data.enter,
          harvest: s.harvest || snapHit(selected).data.harvest,
        });
        if (s.events) snapHit(selected).data.events = s.events;
        persistFunds();
      }
      if (Array.isArray(s.events)) {
        const rows = eventsForAccount(s.events, selected);
        fillEvents(rows);
        const top = rows[0];
        const eid = Number(top && top.id) || 0;
        const prev = seenEventId(selected);
        if (eid > prev) {
          setSeenEventId(selected, eid);
          // 后台自动收利完成后，主动刷资金/日志（首次加载只记 id，不刷）
          if (prev > 0 && top.action === "harvest" && top.ok && !busy) {
            setActionMsg(String(top.detail || "自动收利已完成").slice(0, 220));
            refresh({ force: true, silent: true });
          }
        }
      }
      showSnapAge();
    }

    async function pollLive() {
      if (!selected) return;
      const id = selected;
      const gen = loadGen;
      try {
        const s = await api(`/api/accounts/${id}/monitor`);
        if (gen !== loadGen || !sameAccount(id)) return;
        if (!s.ok) {
          // 监控失败时不要沿用上一账号画面
          if (!snapHit(id) || !(snapHit(id).data && snapHit(id).data.ok)) {
            showAccountError(s, s.account);
          }
          return;
        }
        liveAt = Date.now();
        applyLive(s);
        // 开了自动收利时加快轮询，便于收利后尽快刷资金
        const autoOn = !!(s.account && s.account.auto_harvest);
        const nextMs = autoOn
          ? Math.max(60000, Math.min(pollMs, Number(s.auto_harvest_seconds || 60) * 1000))
          : pollMs;
        if (timer && gen === loadGen) {
          clearInterval(timer);
          timer = setInterval(() => { if (!busy) pollLive(); }, nextMs);
        }
      } catch (err) {
        if (gen === loadGen && sameAccount(id)) showSnapAge();
      }
    }

    function render(s) {
      if (!s || !sameAccount(s.account && s.account.id)) return;
      if (s.ok === false || (s.error && !s.legs)) {
        showAccountError(s, s.account);
        return;
      }
      $("empty").hidden = true;
      $("panel").hidden = false;
      $("error").hidden = !s.error;
      $("error").textContent = s.error || "";
      $("ip").textContent = s.exit_ip || "-";
      $("proxy-mode").textContent = s.proxy_mode || "";
      $("spot").textContent = s.spot_usdt || "-";
      const flexAmt = toNum(s.usdt_flexible);
      $("usdt-flex").textContent = s.usdt_flexible || "0";
      const flexBox = $("usdt-flex-box");
      if (flexBox) flexBox.hidden = !(Number.isFinite(flexAmt) && flexAmt > 0);
      $("bfusd").textContent = s.bfusd || "0";
      $("earn-total").textContent = s.earn_total || "0";
      $("equity").textContent = s.account_total || s.pm_equity || "-";
      $("earn-yesterday").textContent = s.earn_yesterday || "0";
      $("mid-price").textContent = s.price || (s.stability && s.stability.mid) || "-";
      setMmr(s.uni_mmr || "-");
      setAcctLabel(s.account);
      $("symbol-now").textContent = s.symbol || "-";
      const settleChip = $("settle-chip");
      const settleEl = $("settle-asset");
      if (settleChip && settleEl) {
        const settle = s.settle_asset || parseHedgeSymbol(s.symbol).settle;
        settleEl.textContent = settle || "";
        settleChip.hidden = !settle;
      }
      $("lev").textContent = s.leverage || "-";
      const levAct = $("lev-actual");
      if (levAct) levAct.textContent = s.leverage || "-";
      const levTgt = $("lev-target");
      const levInput = $("lev-edit");
      const target = (s.account && s.account.hedge_leverage) || s.leverage_target || "";
      if (levTgt) levTgt.textContent = target || "-";
      if (levInput && document.activeElement !== levInput) {
        levInput.value = target || "";
        levInput.placeholder = s.leverage_target ? String(s.leverage_target) : "100";
      }
      const proxyVal = (s.account && s.account.proxy) || "";
      $("proxy-now").textContent = proxyVal || "默认";
      hideEditBoxes();
      const mg = s.margin || {};
      const box = $("collateral");
      const rows = (mg.rows || []).filter((r) => Number(r.amount) > 0);
      box.hidden = rows.length === 0;
      box.innerHTML = "";
      rows.forEach((r) => {
        const el = document.createElement("span");
        el.className = "chip";
        el.innerHTML = `${esc(r.name)} <b>${esc(r.amount)}</b><em>计入 ${esc(r.in_pm)}</em> · ${esc(r.rate)}`;
        box.appendChild(el);
      });
      applyLive(s);
      liveAt = Date.now();
      const others = s.other_positions || [];
      if (others.length) {
        const tip = others.map((r) => `${r.symbol} ${r.side} ${r.qty}`).join("，");
        setActionMsg(`当前套保币对无仓，但账户还有持仓：${tip}。请在设置里把套保改成对应币对。`);
      }
      const sw = s.switch || {};
      $("btn-switch").disabled = !sw.can_click;
      $("btn-switch").title = sw.reason || "";
      $("proxy-edit").value = (s.account && s.account.proxy) || "";
      if (s.hedge_symbols && s.hedge_symbols.length) hedgeSymbols = mergeHedgeSymbols(s.hedge_symbols);
      const curSym = (s.account && s.account.hedge_symbol) || s.symbol || "ETHUSDT";
      syncHedgePickers($("settle-edit"), $("base-edit"), $("symbol-preview"), null, curSym);
      lastSymbol = curSym;
      const eventRows = eventsForAccount(s.events || [], selected);
      fillEvents(eventRows);
      if (eventRows.length) setSeenEventId(selected, eventRows[0].id);
      showSnapAge();
    }

    async function refresh({ force = false, silent = false } = {}) {
      if (!selected) return;
      const id = selected;
      const gen = loadGen;
      if (!force && snapFresh(id)) {
        const hit = snapHit(id);
        if (hit && hit.data && hit.data.ok !== false) {
          render(hit.data);
          showSnapAge();
          return;
        }
      }
      try {
        const s = await api(`/api/accounts/${id}/snapshot${force ? "?force=true" : ""}`);
        if (gen !== loadGen || !sameAccount(id)) return;
        if (s.ok) {
          rememberSnap(id, s);
          render(s);
          return;
        }
        // 失败快照不要污染该账号缓存里的成功数据
        const prev = snapHit(id);
        if (!(prev && prev.data && prev.data.ok)) {
          rememberSnap(id, s);
        }
        showAccountError(s, s.account);
        showSnapAge();
      } catch (err) {
        if (gen !== loadGen || !sameAccount(id)) return;
        if (snapHit(id) && snapHit(id).data && snapHit(id).data.ok && silent) {
          showSnapAge();
          return;
        }
        showAccountError({ error: err.message, account: { id: Number(id) } });
      }
    }

    function hideEditBoxes() {
      $("edit-symbol-box").hidden = true;
      $("edit-proxy-box").hidden = true;
    }

    function setActionMsg(text) {
      const el = $("action-msg");
      if (!text) {
        el.hidden = true;
        el.textContent = "";
        return;
      }
      el.hidden = false;
      el.textContent = text;
    }

    function formatActionResult(data) {
      if (data.blocked) return "已拦截：" + (data.reason || "");
      if (data.error) return data.error;
      const rows = (data.steps || []).map((s) => {
        const t = s.at ? `${s.at} ` : "";
        return `${s.ok ? "✓" : "✗"} ${t}${s.name}：${s.detail || ""}`;
      });
      return (data.ok ? "完成" : "失败") + (rows.length ? "\n" + rows.join("\n") : "");
    }

    async function act(action) {
      if (!selected || busy) return;
      const meta = ACTIONS[action] || { title: action, hint: "" };
      const live = (snapHit(selected) && snapHit(selected).data) || {};
      const unstable = !((live.stability || {}).stable);
      const payload = { action, force: false, mode: null };
      if (action === "enter" && ["LONG", "SHORT", "IMBALANCE"].includes((live.legs || {}).missing)) {
        const miss = (live.legs || {}).missing;
        const ok = await confirmAction({
          title: "对冲缺口",
          body:
            miss === "IMBALANCE"
              ? "多空数量不一致。会先挂单补齐，不成交再市价。"
              : `现在缺 ${miss === "LONG" ? "多仓" : "空仓"}。会先挂单补齐，不成交再市价。`,
          okText: "补齐对冲",
          danger: true,
        });
        if (!ok) return;
        payload.force = true;
        payload.mode = "force";
      } else if (action === "scale") {
        const en = live.enter || {};
        if (!en.scale_ok && !unstable) {
          setActionMsg(en.reason || "当前不能加仓");
          return;
        }
        if (unstable) {
          const choice = await confirmChoices({
            title: "价格不稳",
            body: `预估两边各加 ${en.add_qty || "-"}（目标 ${en.target_qty || "-"}）。现在加仓可能挂不齐。`,
            okText: "强行加仓",
            okId: "force",
            danger: true,
          });
          if (!choice) return;
          payload.force = true;
          payload.mode = "force";
        } else {
          const ok = await confirmAction({
            title: "加仓",
            body: `uniMMR 安全线内预估：目标 ${en.target_qty}，现在 ${en.current_qty}，两边各加 ${en.add_qty}`,
            okText: "确认加仓",
            danger: true,
          });
          if (!ok) return;
        }
      } else if (action === "enter" && unstable) {
        const legs = live.legs || {};
        const hedged = Number(legs.long_qty) > 0 && Number(legs.short_qty) > 0;
        if (hedged) {
          setActionMsg("已有对冲。要放大仓位请点「加仓」");
          return;
        }
        const choice = await confirmChoices({
          title: "价格不稳",
          body: "现在开仓两边可能挂不齐。",
          extraText: "只买理财",
          extraId: "earn_only",
          okText: "强行开仓",
          okId: "force",
          danger: true,
        });
        if (!choice) return;
        payload.mode = choice;
        payload.force = choice === "force";
      } else if (action === "harvest" && unstable) {
        const choice = await confirmChoices({
          title: "价格不稳",
          body: "现在平仓可能滑点更大。",
          okText: "强行收利",
          okId: "force",
          danger: true,
        });
        if (!choice) return;
        payload.force = true;
        payload.mode = "force";
      } else {
        const ok = await confirmAction({
          title: meta.title,
          body: "",
          okText: "确认",
          danger: true,
        });
        if (!ok) return;
      }
      showLoading(meta.title, "请稍候");
      try {
        const data = await api(`/api/accounts/${selected}/actions`, {
          method: "POST",
          body: JSON.stringify(payload),
        });
        hideModal();
        if (data.snapshot && !data.blocked) {
          rememberSnap(selected, data.snapshot);
          render(data.snapshot);
        }
        setActionMsg(formatActionResult(data));
        // 收利后申购/划转刚落账，再强制刷一次资金与操作日志
        if (action === "harvest" && !data.blocked) {
          await refresh({ force: true, silent: true });
        }
      } catch (err) {
        hideModal();
        setActionMsg(err.message);
      }
    }

        $("edit-proxy-box").hidden = true;
        await loadAccounts();
        await refresh({ force: true });
        setActionMsg("已分配 Webshare 代理：" + (acc.proxy || ""));
      } catch (err) {
        setActionMsg(err.message);
      } finally {
        hideModal();
      }
    };
    $("btn-save-symbol").onclick = async () => {
      if (!selected || busy) return;
      const symbol = currentEditSymbol();
      if (symbol === lastSymbol) {
        $("edit-symbol-box").hidden = true;
        return;
      }
      const ok = await confirmAction({
        title: "更换套保",
        body: `${parseHedgeSymbol(symbol).settle} 结算 · ${parseHedgeSymbol(symbol).base} → ${symbol}`,
        okText: "确认",
        danger: true,
      });
      if (!ok) {
        syncHedgePickers($("settle-edit"), $("base-edit"), $("symbol-preview"), null, lastSymbol);
        return;
      }
      showLoading("保存中", "请稍候");
      try {
        await api(`/api/accounts/${selected}`, {
          method: "PATCH",
          body: JSON.stringify({ hedge_symbol: symbol }),
        });
        lastSymbol = symbol;
        $("edit-symbol-box").hidden = true;
        await loadAccounts();
        await refresh({ force: true });
        setActionMsg("已保存 " + symbol);
      } catch (err) {
        syncHedgePickers($("settle-edit"), $("base-edit"), $("symbol-preview"), null, lastSymbol);
        setActionMsg(err.message);
      } finally {
        hideModal();
      }
    };
    $("btn-save-tp").onclick = async () => {
      if (!selected || busy) return;
      const raw = $("tp-edit").value.trim();
      const value = raw === "" ? 0 : Number(raw);
      if (!Number.isFinite(value) || value < 0) {
        setActionMsg("请输入有效的收利金额");
        return;
      }
      busy = true;
      try {
        const acc = await api(`/api/accounts/${selected}`, {
          method: "PATCH",
          body: JSON.stringify(
            value > 0
              ? { take_profit_usdt: value, take_profit_custom: true }
              : { take_profit_usdt: 0, take_profit_custom: false }
          ),
        });
        if (snapHit(selected) && snapHit(selected).data) {
          snapHit(selected).data.account = Object.assign(snapHit(selected).data.account || {}, acc);
          persistFunds();
        }
        await pollLive();
        setActionMsg(value > 0 ? `已锁定每次浮盈 ${value} USDT 收利` : "已改回按仓位自动计算");
      } catch (err) {
        setActionMsg(err.message);
      } finally {
        busy = false;
      }
    };
    $("btn-tp-auto").onclick = async () => {
      if (!selected || busy) return;
      busy = true;
      try {
        const acc = await api(`/api/accounts/${selected}`, {
          method: "PATCH",
          body: JSON.stringify({ take_profit_usdt: 0, take_profit_custom: false }),
        });
        if (snapHit(selected) && snapHit(selected).data) {
          snapHit(selected).data.account = Object.assign(snapHit(selected).data.account || {}, acc);
          persistFunds();
        }
        await pollLive();
        setActionMsg("已改回按仓位自动计算，收利加仓后会重算");
      } catch (err) {
        setActionMsg(err.message);
      } finally {
        busy = false;
      }
    };
    $("auto-harvest").onchange = async () => {
      if (!selected || busy) return;
      const on = !!$("auto-harvest").checked;
      busy = true;
      try {
        const acc = await api(`/api/accounts/${selected}`, {
          method: "PATCH",
          body: JSON.stringify({ auto_harvest: on }),
        });
        if (snapHit(selected) && snapHit(selected).data) {
          snapHit(selected).data.account = Object.assign(snapHit(selected).data.account || {}, acc);
          persistFunds();
        }
        setActionMsg(on
          ? "已开启自动：无仓严平稳开仓；有仓须金叉/死叉+收利宽平稳"
          : "已关闭自动收利");
        await pollLive();
      } catch (err) {
        $("auto-harvest").checked = !on;
        setActionMsg(err.message);
      } finally {
        busy = false;
      }
    };
    $("btn-set-leverage").onclick = async () => {
      if (!selected || busy) return;
      const n = Math.round(Number($("lev-edit") && $("lev-edit").value));
      if (!Number.isFinite(n) || n < 1 || n > 125) {
        setActionMsg("杠杆填 1 到 125");
        return;
      }
      busy = true;
      try {
        const acc = await api(`/api/accounts/${selected}`, {
          method: "PATCH",
          body: JSON.stringify({ hedge_leverage: n }),
        });
        if (snapHit(selected) && snapHit(selected).data) {
          snapHit(selected).data.account = Object.assign(snapHit(selected).data.account || {}, acc);
          snapHit(selected).data.leverage_target = n;
          persistFunds();
        }
        if ($("lev-target")) $("lev-target").textContent = String(n);
      } catch (err) {
        setActionMsg(err.message);
        busy = false;
        return;
      }
      busy = false;
      act("leverage");
    };
    $("btn-enter").onclick = () => act("enter");
    $("btn-scale").onclick = () => act("scale");
    $("btn-harvest").onclick = () => act("harvest");
    $("btn-switch").onclick = () => act("switch");
    $("btn-proxy").onclick = async () => {
      if (!selected || busy) return;
      const ok = await confirmAction({
        title: "保存代理",
        body: "",
        okText: "确认",
      });
      if (!ok) return;
      showLoading("保存中", "请稍候");
      try {
        await api(`/api/accounts/${selected}`, {
          method: "PATCH",
          body: JSON.stringify({ proxy: $("proxy-edit").value }),
        });
        $("edit-proxy-box").hidden = true;
        await loadAccounts();
        await refresh({ force: true });
        setActionMsg("已保存");
      } catch (err) {
        setActionMsg(err.message);
      } finally {
        hideModal();
      }
    };
    $("btn-delete").onclick = async () => {
      if (!selected || busy) return;
      const ok = await confirmAction({
        title: "解绑账号",
        body: "",
        okText: "确认",
        danger: true,
      });
      if (!ok) return;
      showLoading("解绑中", "请稍候");
      try {
        await api(`/api/accounts/${selected}`, { method: "DELETE" });
        delete snapCache[cacheId(selected)];
        persistFunds();
        selected = null;
        if (timer) clearInterval(timer);
        $("panel").hidden = true;
        $("empty").hidden = false;
        await loadAccounts();
      } finally {
        hideModal();
      }
    };
    $("btn-events-history").onclick = () => openEventsHistory({ append: false });
    $("events-history-more").onclick = () => openEventsHistory({ append: true });
    $("events-history-close").onclick = () => closeEventsHistory();
    $("events-overlay").addEventListener("click", (ev) => {
      if (ev.target === $("events-overlay")) closeEventsHistory();
    });
    $("log-close").onclick = () => closeLogDetail();
    $("log-ok").onclick = () => closeLogDetail();
    $("log-overlay").addEventListener("click", (ev) => {
      if (ev.target === $("log-overlay")) closeLogDetail();
    });
    $("log-copy").onclick = async () => {
      try {
        await navigator.clipboard.writeText(_logFullText || "");
        $("log-copy").textContent = "已复制";
        setTimeout(() => { $("log-copy").textContent = "复制全文"; }, 1200);
      } catch (err) {
        $("log-copy").textContent = "复制失败";
        setTimeout(() => { $("log-copy").textContent = "复制全文"; }, 1200);
      }
    };
    document.addEventListener("keydown", (ev) => {
      if (ev.key !== "Escape") return;
      if (!$("log-overlay").hidden) closeLogDetail();
    });

    $("btn-logout").onclick = async () => {
      try {
        await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
      } catch (err) {}
      location.replace("/");
    };
    bindHedgePickers("add-settle", "add-base", "add-symbol-preview", "add-symbol");
    bindHedgePickers("settle-edit", "base-edit", "symbol-preview", null);
    restoreFunds();
    loadAccounts();
  </script>
</body>
</html>
