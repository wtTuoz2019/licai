# 用现货里的哪种资产去买活期
source_asset: USDT

# 每次投入金额。0 表示用 source_asset 的全部可用余额
amount: 0

# 非 sweep 路径的单次投入硬顶。一键入场会 sweep_all，不受这个限制
max_amount: 100000

# 申购来源账户：SPOT / FUND / ALL
source_account: SPOT

# 统一账户（Portfolio Margin）：申购后仓位直接计入保证金，无需划转到合约
unified_account: true

# 只看 USDT 名下能当合约保证金的保本活期：USDT 活期 + BFUSD
margin_earn_assets:
  - USDT
  - BFUSD

asset_allowlist:
  - USDT
  - BFUSD

# 申购后留在活期。统一账户下必须为 true
keep_earn: true

# 统一账户不划转
transfer_to_futures: false
enable_multi_assets: false

# 年化过滤，单位是百分比。max_apr 设 0 表示不设上限
min_apr: 0
max_apr: 200

asset_denylist: []

settle_seconds: 3

# ---- 对冲循环 ----
# 套保：按百分比/名义配置，BTC/ETH/SOL 等各币对通用（默认 ETHUSDT）
hedge_symbol: ETHUSDT
hedge_symbols:
  - ETHUSDT
  - BTCUSDT
  - ETHUSDC
  - BTCUSDC
  - SOLUSDT
  - BNBUSDT
hedge_leverage: 100          # 目标杠杆。入场/加仓会尝试提到这个倍数；算仓始终以交易所实际杠杆为准。每个账号可在设置里改
hedge_qty: 0                 # 0 表示按理财保证金自动算仓位，并随理财仓位变大加仓
hedge_margin_use_pct: 0.85   # 低杠杆最多用到 85% 保证金；100x 仍按 40/杠杆 ≈ 40%，留给平仓补仓的单边窗口
min_uni_mmr: 2               # uniMMR=权益/维持保证金，越大越安全；爆仓约 1.05，低于 2 不加仓
scale_min_add_pct: 0.03      # 目标仓位比当前大 3% 以上才两边一起加
# 收利门槛按单边仓位名义本金算，不再固定绝对值。账号里保存过自定义值才锁定
take_profit_usdt: 0
maker_only: false            # 入场/加仓仍可市价兜底；收利平仓固定只挂 GTX；补仓先长挂再市价
quote_refresh_seconds: 2     # 每轮挂单约 1–1.5s 改价
hedge_quote_retries: 8       # 挂单轮数：入场/补仓约 12+，平仓更长
maker_improve_bps: 1         # 追价时相对现价最多往里靠 1bp；仍留 1 档，GTX 不吃单
maker_passive_bps: 2         # 首挂：买/卖相对买一/卖一往外约 2bp，少贴盘口少 -5022
maker_passive_ticks: 2       # 首挂至少离买一/卖一 2 档（与 bp 取更远）
# 第二腿（单边成交后补齐）：先等多一会 → maker 追价 1–2 次 → 再市价
hedge_max_wait_seconds: 2.0  # 第一腿成交后最多再等多久第二腿挂单
hedge_second_leg_chases: 2   # 超时/逃逸后、市价前再 GTX 追价次数
hedge_max_slippage_bps: 3.5  # 相对第一腿成交价，BBO 不利偏离超过此 bp 则进入追价/市价
watch_seconds: 60            # 命令行盯盘间隔
live_poll_seconds: 120       # 操作台仓位/浮盈刷新间隔，不必太勤
auto_harvest_seconds: 60     # 开启「自动收利」后后台检查间隔（与 MACD 1 分钟对齐）
# 自动收利：无仓且严平稳时自动开仓；有仓须 MACD 金叉/死叉 + 收利宽平稳（金叉收空/死叉收多）
# 接口示例 https://c7.pro/capi/indicator
macd_auto_harvest: true
macd_indicator_url: "https://c7.pro/capi/indicator"
min_free_usdt_keep: 0        # 默认不留现货 USDT
cycle_sweep_all: true        # 启动时把现货闲置 USDT 申购 USDT/BFUSD 活期（仓位继续当保证金）

# 手续费：页面优先拉账户真实费率 / 近期成交实付；下面仅作接口失败时的兜底
maker_fee_rate: 0.0002
taker_fee_rate: 0.0005
min_profit_fee_multiple: 8   # 自动门槛：浮盈至少覆盖约 8 倍手续费
harvest_principal_pct: 0.01  # 还没仓位时，至少为本金的 1%
harvest_pos_pct: 0.03        # 单边名义约 3% 再收（少收几次，少磨损）
harvest_sqrt_coeff: 0.5      # 无仓位时 0.5×√本金兜底
harvest_min_usdt: 1          # 绝对下限（结算币，USDT/USDC 都适用）
cooldown_minutes: 15         # 两次平仓最短间隔
stable_range_pct: 0.0025     # 入场：15 分钟振幅 ≤ 0.25%；近 5/2 分钟按比例更严
stable_spread_pct: 0.00025   # 入场：盘口价差 ≤ 0.025%
harvest_stable_range_pct: 0.006  # 收利：15 分钟振幅 ≤ 0.6%（比入场宽，交叉时更容易收）
harvest_stable_spread_pct: 0.0006  # 收利：盘口价差 ≤ 0.06%
harvest_stable_wait_seconds: 90  # 收利中平仓/补仓前最多等多久变平稳；超时仍继续

# 换产品：分批赎回旧仓、立刻申购更高年化。按赎回瞬间这块保证金暂时失效来估
switch_safe_uni_mmr: 2.5     # 换产品时 uniMMR 不得低于这个（比开仓安全线更严）
switch_batch_pct: 0.15       # 每批最多赎当前仓位的 15%
switch_batch_usdt: 200       # 每批硬顶 USDT
switch_min_batch: 10         # 小于这个就并进本批或留到下次
switch_max_batches: 5        # 点一次最多换几批，剩下再点

# ---- Webshare 代理（秘钥优先放 .env 的 WEBSHARE_API_TOKEN）----
# webshare_api_token: ""     # 一般不要写进 yaml，用环境变量
webshare_mode: direct        # direct | backbone（住宅池用 backbone）
webshare_country: ""         # 如 US,HK；空=不限
webshare_auto_assign: true   # 添加账号未填代理时自动分配

